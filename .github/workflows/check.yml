name: Check public subscription
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this fully validated snapshot to the checked branch
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '23 * * * *'
    - cron: '53 * * * *'
permissions:
  contents: read
env:
  VPN_DIAGNOSTICS_DIR: /tmp/pipeline-diagnostics
concurrency:
  group: checked-subscription
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 111
    permissions:
      contents: read
      actions: read
    env:
      CADENCE_PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)) }}
    outputs:
      history_commit: ${{ steps.freeze.outputs.history_commit }}
      matrix: ${{ steps.freeze.outputs.matrix }}
      manifest_sha256: ${{ steps.freeze.outputs.manifest_sha256 }}
      core_artifact_id: ${{ steps.core-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Offline tests
        timeout-minutes: 5
        run: python3 -m unittest discover -s tests -v
      - name: Authenticate history and reserve the next hourly snapshot slot
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 cadence_limiter.py reserve --ticket /tmp/cadence-slot.json
      - name: Wait within the shared publication lock
        timeout-minutes: 62
        run: python3 cadence_limiter.py wait --ticket /tmp/cadence-slot.json
      - name: Download and verify the pinned official core once for all shards
        timeout-minutes: 4
        run: python3 fetch_core.py --download-only /tmp/pinned-core/core.tar.gz
      - name: Share the exact verified archive within this run
        id: core-artifact
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pinned-core-${{ github.run_attempt }}
          path: /tmp/pinned-core/core.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Freeze current sources and authenticated 48-hour retest history
        timeout-minutes: 15
        id: freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 cadence_limiter.py prepare --ticket /tmp/cadence-slot.json --manifest /tmp/frozen/manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: frozen-manifest
          path: /tmp/frozen/
          if-no-files-found: error
          retention-days: 1
      - name: Keep sanitized pipeline diagnosis for 14 days
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: diagnostics-prepare
          path: /tmp/pipeline-diagnostics/diagnostic.json
          if-no-files-found: ignore
          retention-days: 14
  shard:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frozen-manifest
          path: /tmp/frozen
      - name: Verify exact prepare-stage manifest digest
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest_sha256 }}
        run: |
          test "$(cat /tmp/frozen/manifest.sha256)" = "$EXPECTED_MANIFEST_SHA256"
          echo "$EXPECTED_MANIFEST_SHA256  /tmp/frozen/manifest.json" | sha256sum --check --status
      - name: Require one exact prepare-stage core artifact ID
        env:
          CORE_ARTIFACT_ID: ${{ needs.prepare.outputs.core_artifact_id }}
        run: '[[ "$CORE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - name: Download the prepare-stage core artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.prepare.outputs.core_artifact_id }}
          path: /tmp/pinned-core
          merge-multiple: true
      - name: Independently verify and install the checksum-pinned core
        run: python3 fetch_core.py --archive /tmp/pinned-core/core.tar.gz
      - name: Synthetic new-parser conformance against the pinned binary
        run: SING_BOX_TEST_BIN="$PWD/bin/sing-box" python3 -m unittest discover -s tests -p test_parser_compat.py -v
      - name: Preflight core schema and check every frozen shard candidate
        env:
          SHARD_ID: ${{ matrix.shard }}
        run: python3 production.py shard --manifest /tmp/frozen/manifest.json --shard "$SHARD_ID" --output /tmp/shard-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probe-shard-${{ matrix.shard }}
          path: /tmp/shard-results/
          if-no-files-found: error
          retention-days: 1
      - name: Keep sanitized pipeline diagnosis for 14 days
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: diagnostics-shard-${{ matrix.shard }}
          path: /tmp/pipeline-diagnostics/diagnostic.json
          if-no-files-found: ignore
          retention-days: 14
  merge:
    needs: [prepare, shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frozen-manifest
          path: /tmp/frozen
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: probe-shard-*
          path: /tmp/shard-results
          merge-multiple: true
      - name: Verify exact prepare-stage manifest digest
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest_sha256 }}
        run: |
          test "$(cat /tmp/frozen/manifest.sha256)" = "$EXPECTED_MANIFEST_SHA256"
          echo "$EXPECTED_MANIFEST_SHA256  /tmp/frozen/manifest.json" | sha256sum --check --status
      - name: Require complete fresh coverage and assemble current feeds only
        run: python3 production.py merge --manifest /tmp/frozen/manifest.json --shards /tmp/shard-results --output /tmp/checked-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checked-output
          path: /tmp/checked-output/
          if-no-files-found: error
          retention-days: 1
      - name: Keep sanitized pipeline diagnosis for 14 days
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: diagnostics-merge
          path: /tmp/pipeline-diagnostics/diagnostic.json
          if-no-files-found: ignore
          retention-days: 14
  publish:
    needs: [prepare, merge]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frozen-manifest
          path: /tmp/frozen
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: checked-output
          path: /tmp/checked-output
      - name: Validate bounded output and exact source snapshot again
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest_sha256 }}
        run: |
          test "$(cat /tmp/frozen/manifest.sha256)" = "$EXPECTED_MANIFEST_SHA256"
          echo "$EXPECTED_MANIFEST_SHA256  /tmp/frozen/manifest.json" | sha256sum --check --status
          python3 production.py verify-public --manifest /tmp/frozen/manifest.json --output /tmp/checked-output
      - name: Keep sanitized pipeline diagnosis for 14 days
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: diagnostics-publish
          path: /tmp/pipeline-diagnostics/diagnostic.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve checked history and publish with a concurrent-update lease
        env:
          HISTORY_COMMIT: ${{ needs.prepare.outputs.history_commit }}
        run: |
          set -euo pipefail
          test "$(git ls-remote --heads origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          publication_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 publish_status.py --output /tmp/checked-output --publication-at "$publication_at"
          export GIT_AUTHOR_DATE="$publication_at" GIT_COMMITTER_DATE="$publication_at"
          cp LICENSE NOTICE.md /tmp/checked-output/
          cp -r licenses /tmp/checked-output/
          expected="$(git ls-remote --heads origin refs/heads/checked | cut -f1)"
          test "$expected" = "$HISTORY_COMMIT"
          if [ -n "$expected" ]; then
            git fetch --no-tags origin refs/heads/checked
            test "$(git rev-parse FETCH_HEAD)" = "$expected"
            git switch --detach "$expected"
          else
            git switch --orphan checked
          fi
          git rm -r --ignore-unmatch .
          cp -r /tmp/checked-output/. .
          git add -- subscription.txt subscription-gpt.txt subscription-youtube.txt subscription-youtube-stable.txt subscription-youtube-reserve.txt history.json report.json STATUS.md LICENSE NOTICE.md licenses
          if git diff --cached --quiet; then
            echo 'Snapshot unchanged; nothing to publish.'
            exit 0
          fi
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Publish complete frozen-snapshot check'
          if [ -n "$expected" ]; then
            git merge-base --is-ancestor "$expected" HEAD
          fi
          test "$(git ls-remote --heads origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git push --force-with-lease="refs/heads/checked:$expected" origin HEAD:refs/heads/checked
