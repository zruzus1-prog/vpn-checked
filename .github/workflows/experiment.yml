name: Isolated encrypted Russian-egress feasibility trial
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-ru-detour-feasibility
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Read exact isolated branch without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Offline fail-closed tests
        run: python3 -m unittest discover -s experiments/ru-detour -v
      - name: Install SHA-pinned official sing-box
        run: python3 fetch_core.py
      - name: Mandatory pinned-core baseline and no-fallback runtime smoke
        env:
          RUN_CORE_SMOKE: '1'
        run: python3 -m unittest discover -s experiments/ru-detour -v
      - name: Bounded encrypted TCP trial, no feed publication
        run: python3 experiments/ru-detour/trial.py
      - name: Upload credential-free result only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ru-detour-diagnostics
          path: experiments/ru-detour/results.json
          if-no-files-found: warn
          retention-days: 3
