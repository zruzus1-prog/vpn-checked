name: Bounded public proxy experiment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bounded-public-proxy-experiment
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: experiments/proxy-trial
    steps:
      - name: Read repository without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Offline tests
        run: python3 -m unittest -v test_trial
      - name: Get allowlisted feeds and checksum-pinned official core
        run: python3 prepare_inputs.py
      - name: Two-round bounded feasibility sample
        run: python3 trial.py run --vantage 'GitHub ubuntu-24.04 hosted runner; not Russia or the user network'
      - name: Upload credential-free diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bounded-proxy-experiment-diagnostics
          path: |
            experiments/proxy-trial/inventory.json
            experiments/proxy-trial/results.json
            experiments/proxy-trial/core-verification.json
          if-no-files-found: warn
          retention-days: 3
